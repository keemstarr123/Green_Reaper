  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const btns = document.querySelectorAll('.map-control-btn');
      btns.forEach(btn => {
        btn.addEventListener('mouseenter', () => btn.style.backgroundColor = '#f0f7ff');
        btn.addEventListener('mouseleave', () => btn.style.backgroundColor = 'white');
      });
    });
  </script>

<script>
  let map;
  let drawingManager;

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      center: { lat: 3.139, lng: 101.6869 }, // Kuala Lumpur
      zoom: 15,
    });

    drawingManager = new google.maps.drawing.DrawingManager({
      drawingMode: google.maps.drawing.OverlayType.CIRCLE, // Default to circle
      drawingControl: true,
      drawingControlOptions: {
        position: google.maps.ControlPosition.TOP_CENTER,
        drawingModes: ['circle'] // Only allow drawing circles
      },
      circleOptions: {
        fillColor: '#00FF00',
        fillOpacity: 0.3,
        strokeWeight: 2,
        clickable: true,
        editable: true,
        zIndex: 1
      }
    });

    drawingManager.setMap(map);

    // Save circle info on complete
    google.maps.event.addListener(drawingManager, 'overlaycomplete', function (event) {
      if (event.type === 'circle') {
        const center = event.overlay.getCenter();
        const radius = event.overlay.getRadius();
        const locationData = {
          type: "circle",
          center: { lat: center.lat(), lng: center.lng() },
          radius: radius
        };
        document.getElementById('latitude').value = center.lat();
        document.getElementById('longitude').value = center.lng();
        console.log("🟢 Selected Circle:", locationData);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('input[type="file"]').forEach(input => {
      const filenameSpan = input.closest('label').querySelector('.filename');
      input.addEventListener('change', () => {
        const name = input.files?.[0]?.name || '';
        filenameSpan.textContent = name;
        filenameSpan.setAttribute('title', name); // show full name on hover
      });
    });
  });
</script>


<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCJArOGKcQAr8ZLPl1LLQOBOI-YGHCZuc8&callback=initMap&libraries=drawing"
